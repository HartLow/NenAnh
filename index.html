<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-gradient">
    <div class="container py-5">
        <div class="d-flex justify-content-center align-items-center gap-3 mb-4">
            <h1 class="fw-semibold mb-0 lang" data-lang-key="title">Trình Nén Ảnh Online</h1>
            <div class="dropdown">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-globe"></i> <span class="current-lang">VI</span>
                </button>
                <ul class="dropdown-menu" aria-labelledby="languageDropdown">
                    <li><button class="dropdown-item" data-lang="vi">Tiếng Việt</button></li>
                    <li><button class="dropdown-item" data-lang="en">English</button></li>
                </ul>
            </div>
        </div>
        <p class="text-center text-muted mb-2">Made by Hartlow</p>
        <p class="text-center text-muted mb-5 lang" data-lang-key="description">Nén không giới hạn ảnh với chất lượng ảnh tối ưu</p>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card main-card">
                    <div class="card-body">
                        <div class="upload-area text-center p-5" id="dropZone">
                            <i class="bi bi-cloud-arrow-up display-1 text-primary"></i>
                            <h4 class="mt-3">Kéo & Thả Ảnh Vào Đây</h4>
                            <p class="text-muted">hoặc</p>
                            <input type="file" id="fileInput" accept="image/*" multiple class="d-none">
                            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                                <i class="bi bi-folder"></i> Chọn Ảnh
                            </button>
                        </div>

                        <div class="compression-options mt-4">
                            <h5>Chất Lượng Mặc Định</h5>
                            <div class="preset-buttons mb-3">
                                <button class="btn btn-sm btn-outline-primary me-2" data-quality="80">Chất Lượng Cao</button>
                                <button class="btn btn-sm btn-outline-primary me-2" data-quality="50">Cân Bằng</button>
                                <button class="btn btn-sm btn-outline-primary" data-quality="30">Dung Lượng Nhỏ</button>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Chất lượng (1-100)</label>
                                <div class="d-flex align-items-center">
                                    <input type="range" class="form-range me-2" id="qualityRange" min="1" max="100" value="80">
                                    <span id="qualityValue" class="ms-2">80</span>%
                                </div>
                            </div>
                        </div>

                        <div id="recentPreviews" class="mt-4 d-none">
                            <h6 class="d-flex align-items-center">
                                <span>Xem Trước Gần Đây</span>
                                <button class="btn btn-sm btn-link ms-auto" id="clearHistory">Xóa</button>
                            </h6>
                            <div class="recent-preview-list row g-2"></div>
                        </div>

                        <div id="previewArea" class="mt-4 d-none">
                            <h5>Xem Trước</h5>
                            <div class="row" id="imagePreview"></div>
                            <div class="text-center mt-3">
                                <button class="btn btn-primary me-2" id="compressBtn">
                                    <i class="bi bi-compress"></i> Nén Ảnh
                                </button>
                                <button class="btn btn-success" id="downloadBtn">
                                    <i class="bi bi-download"></i> Tải Xuống Tất Cả
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Attribution -->
        <p class="text-center mt-4 small text-muted">
            Made by HartLow <i class="bi bi-heart-fill text-danger"></i>
        </p>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalImageName"></h5>
                    <div class="d-flex align-items-center gap-2">
                        <span class="image-size-info me-3" id="imageSizeInfo"></span>
                        <button class="btn btn-light btn-sm" id="fullscreenBtn">
                            <i class="bi bi-fullscreen"></i>
                        </button>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body p-0">
                    <div class="image-zoom-container">
                        <img id="modalImage" class="img-fluid w-100" alt="">
                    </div>
                    <div class="zoom-controls">
                        <button class="btn btn-light btn-sm" id="zoomOut">
                            <i class="bi bi-zoom-out"></i>
                        </button>
                        <span id="zoomLevel">100%</span>
                        <button class="btn btn-light btn-sm" id="zoomIn">
                            <i class="bi bi-zoom-in"></i>
                        </button>
                        <button class="btn btn-light btn-sm" id="zoomReset">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
